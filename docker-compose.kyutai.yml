services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: gateway-runtime
      provenance: false
      sbom: false
    image: sky-audio-gateway:latest
    restart: unless-stopped
    init: true
    depends_on:
      stt:
        condition: service_healthy
      kyutai:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8585}:${PORT:-8585}"
    environment:
      TTS_ENGINE: kyutai
      PORT: ${PORT:-8585}
      SKY_AUDIO_API_KEY: ${SKY_AUDIO_API_KEY:-sky-audio-local-dev}
      SKY_AUDIO_PRELOAD_STT: ${SKY_AUDIO_PRELOAD_STT:-1}
      SKY_AUDIO_EXTERNAL_STT: "1"
      SKY_AUDIO_EXTERNAL_TTS: "1"
      SKY_AUDIO_STT_SOCKET: /sockets/sky-audio-stt.sock
      SKY_AUDIO_TTS_POCKET_SOCKET: /sockets/sky-audio-tts-pocket.sock
      SKY_AUDIO_TTS_KYUTAI_SOCKET: /sockets/sky-audio-tts-kyutai.sock
    volumes:
      - sky-audio-sockets:/sockets
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-8585}/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  stt:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: stt-worker-runtime
      provenance: false
      sbom: false
    image: sky-audio-stt-worker:latest
    restart: unless-stopped
    init: true
    environment:
      STT_SOCKET: /sockets/sky-audio-stt.sock
      STT_DEVICE: cpu
    command:
      - sh
      - -lc
      - rm -f "$$STT_SOCKET" && exec /app/workers/python-nemo/.venv/bin/python /app/workers/python-nemo/main.py
    volumes:
      - sky-audio-sockets:/sockets
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /sockets/sky-audio-stt.sock
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  kyutai:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: kyutai-worker-runtime
      provenance: false
      sbom: false
    image: sky-audio-kyutai-worker:latest
    restart: unless-stopped
    init: true
    gpus: all
    environment:
      TTS_KYUTAI_SOCKET: /sockets/sky-audio-tts-kyutai.sock
    command:
      - sh
      - -lc
      - rm -f "$$TTS_KYUTAI_SOCKET" && exec /app/workers/python-kyutai-tts/.venv/bin/python /app/workers/python-kyutai-tts/main.py
    volumes:
      - sky-audio-sockets:/sockets
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /sockets/sky-audio-tts-kyutai.sock
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  sky-audio-sockets:
