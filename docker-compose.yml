services:
  sky-audio:
    build: .
    image: sky-audio:latest
    container_name: sky-audio
    restart: unless-stopped
    ports:
      - "${PORT:-8686}:${PORT:-8686}"
    environment:
      - TTS_ENGINE=${TTS_ENGINE:-pocket}
      - PORT=${PORT:-8686}
      - SKY_AUDIO_API_KEY=${SKY_AUDIO_API_KEY:-}
