[tools]
go = "1.26"
node = "25"
bun = "latest"
python = "3.13"

[tasks.dev]
description = "Start gateway + STT worker (dev mode)"
run = "./scripts/with-onnx-env.sh go run ./gateway/cmd/sky-audio"

[tasks."dev:dashboard"]
description = "Start Vite dev server with HMR (proxy to gateway on :8080)"
run = "cd dashboard && bun run dev"

[tasks.build]
description = "Full production build: dashboard → embed → Go binary"
run = "./build.sh"

[tasks.deploy]
description = "Build, redeploy, and restart the local sky-audio user service"
depends = ["build"]
run = "python scripts/deploy.py"

[tasks."build:dashboard"]
description = "Build dashboard assets only"
run = "cd dashboard && bun install --frozen-lockfile && bun run build"

[tasks."build:gateway"]
description = "Build Go gateway binary (assumes dashboard dist exists)"
run = """
rm -rf gateway/pkg/dashboard/dist
cp -r dashboard/dist gateway/pkg/dashboard/dist
cd gateway && ../scripts/with-onnx-env.sh go build -o sky-audio ./cmd/sky-audio
"""

[tasks."build:proto"]
description = "Recompile protobuf stubs for Go and Python"
run = """
export PATH="$PATH:$(go env GOPATH)/bin"
mkdir -p gateway/pkg/pb workers/python-nemo/pb
protoc \
  --go_out=gateway/pkg/pb --go-grpc_out=gateway/pkg/pb \
  --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative \
  proto/audio_engine.proto
cd workers/python-nemo && uv run python -m grpc_tools.protoc \
  -I=../../proto \
  --python_out=pb \
  --grpc_python_out=pb \
  ../../proto/audio_engine.proto
cd ../..
python3 scripts/normalize-python-protobuf.py workers/python-nemo/pb/audio_engine_pb2.py
sed -i 's/^import audio_engine_pb2 as/from . import audio_engine_pb2 as/' \
  workers/python-nemo/pb/audio_engine_pb2_grpc.py
for dir in workers/python-pocket-tts/pb workers/python-kyutai-tts/pb; do
  mkdir -p "$dir"
  cp workers/python-nemo/pb/audio_engine_pb2.py "$dir/"
  cp workers/python-nemo/pb/audio_engine_pb2_grpc.py "$dir/"
  cp workers/python-nemo/pb/audio_engine_pb2.pyi "$dir/" 2>/dev/null || true
  touch "$dir/__init__.py"
done
"""

[tasks.test]
description = "Run local Go unit and package tests (excludes env-dependent e2e)"
run = "./scripts/with-onnx-env.sh go test $(go list ./gateway/... | grep -v '/gateway/e2e$') -count=1 -v"

[tasks."test:e2e"]
description = "Run gateway end-to-end tests (requires worker sockets and test assets)"
run = "./scripts/with-onnx-env.sh go test ./gateway/e2e -count=1 -v"

[tasks."smoke:realtime-ws"]
description = "Run a live gateway-level websocket smoke test against GET /v1/realtime"
run = "./scripts/smoke-realtime-ws.sh"

[tasks."smoke:realtime-calls"]
description = "Run a live gateway-level WebRTC smoke test against POST /v1/realtime/calls"
run = "./scripts/smoke-realtime-calls.sh"

[tasks.check]
description = "Full validation: vet + test + build"
depends = ["check:vet", "test", "build"]

[tasks."check:vet"]
description = "Go vet"
run = "./scripts/with-onnx-env.sh go vet ./gateway/..."

[tasks."check:types"]
description = "Typecheck all languages"
run = """
./scripts/with-onnx-env.sh go vet ./gateway/...
cd dashboard && bun run typecheck 2>/dev/null || true
cd ../workers/python-nemo && uv run basedpyright main.py streaming_import_smoke.py streaming_eval.py
"""

[tasks.clean]
description = "Remove build artifacts"
run = """
rm -rf gateway/sky-audio gateway/pkg/dashboard/dist dashboard/dist
rm -f /tmp/sky-audio-*.sock
"""

[tasks."worker:stt"]
description = "Run STT worker standalone (for debugging)"
run = "cd workers/python-nemo && uv run python main.py"

[tasks."worker:stt:import-smoke"]
description = "Verify NeMo streaming imports and runtime compatibility"
run = "cd workers/python-nemo && uv run python streaming_import_smoke.py"

[tasks."worker:stt:eval"]
description = "Benchmark the NeMo streaming path against the checked-in voice fixture"
run = "cd workers/python-nemo && uv run python streaming_eval.py"

[tasks."worker:tts-pocket"]
description = "Run PocketTTS worker standalone (for debugging)"
run = "cd workers/python-pocket-tts && uv run python main.py"

[tasks."tts:sync:pocket-local"]
description = "Sync local cloned Pocket voices into worker assets and overlay manifest"
run = "python3 workers/python-pocket-tts/sync_custom_voices.py"

[tasks."worker:tts-kyutai"]
description = "Run KyutaiTTS worker standalone (for debugging)"
run = "cd workers/python-kyutai-tts && uv run python main.py"

[tasks."tts:prefetch:pocket"]
description = "Download and catalog all PocketTTS voices locally"
run = "cd workers/python-pocket-tts && uv run python prefetch_voices.py"

[tasks."tts:prefetch:kyutai"]
description = "Download and catalog all Kyutai voices locally"
run = "cd workers/python-kyutai-tts && uv run python prefetch_voices.py"

[tasks."tts:prefetch"]
description = "Download and catalog all TTS voices locally"
depends = ["tts:prefetch:pocket", "tts:prefetch:kyutai"]

[tasks."docker:build"]
description = "Build the default local Docker Compose stack (gateway + Pocket + STT)"
run = """
DOCKER_BUILDKIT=0 docker build --target gateway-runtime -t sky-audio-gateway:latest -f Dockerfile.compose .
DOCKER_BUILDKIT=0 docker build --target pocket-worker-runtime -t sky-audio-pocket-worker:latest -f Dockerfile.compose .
DOCKER_BUILDKIT=0 docker build --target stt-worker-runtime -t sky-audio-stt-worker:latest -f Dockerfile.compose .
"""

[tasks."docker:up"]
description = "Rebuild and run the default Pocket + GPU STT Docker deployment locally"
depends = ["docker:build"]
run = "docker compose up -d --force-recreate --remove-orphans --no-build gateway pocket stt"

[tasks."docker:down"]
description = "Stop the local Docker deployment without deleting persistent volumes"
run = "docker compose down --remove-orphans"

[tasks."docker:reset"]
description = "Stop the local Docker deployment and delete persistent volumes"
run = "docker compose down -v --remove-orphans"

[tasks."docker:logs"]
description = "Tail logs from the default Pocket + GPU STT Docker deployment"
run = "docker compose logs -f gateway pocket stt"

[tasks."docker:build:kyutai"]
description = "Build the alternate Kyutai + CPU STT Docker deployment images"
run = """
DOCKER_BUILDKIT=0 docker build --target gateway-runtime -t sky-audio-gateway:latest -f Dockerfile.compose .
DOCKER_BUILDKIT=0 docker build --target stt-worker-runtime -t sky-audio-stt-worker:latest -f Dockerfile.compose .
DOCKER_BUILDKIT=0 docker build --target kyutai-worker-runtime -t sky-audio-kyutai-worker:latest -f Dockerfile.compose .
"""

[tasks."docker:up:kyutai"]
description = "Run the alternate Kyutai + CPU STT Docker deployment locally"
depends = ["docker:build:kyutai"]
run = "docker compose -f docker-compose.kyutai.yml up -d --force-recreate --remove-orphans --no-build gateway stt kyutai"

[tasks."docker:down:kyutai"]
description = "Stop the alternate Kyutai + CPU STT Docker deployment without deleting persistent volumes"
run = "docker compose -f docker-compose.kyutai.yml down --remove-orphans"

[tasks."docker:reset:kyutai"]
description = "Stop the alternate Kyutai + CPU STT Docker deployment and delete persistent volumes"
run = "docker compose -f docker-compose.kyutai.yml down -v --remove-orphans"

[tasks."docker:logs:kyutai"]
description = "Tail logs from the alternate Kyutai + CPU STT Docker deployment"
run = "docker compose -f docker-compose.kyutai.yml logs -f gateway stt kyutai"
